name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Roblox build tools
        run: aftman install

      - name: Build and bundle
        run: pnpm run check
